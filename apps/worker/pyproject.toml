[project]
name = "atlas-worker"
version = "0.1.0"
description = "Async ingest worker"
requires-python = ">=3.12"
dependencies = [
  "atlas-common",
  "atlas-security",
  "atlas-ingestion",
  "atlas-persistence",
  "atlas-retrieval",
  "redis>=5.2.0",
  "arq>=0.26.0",
  "qstash>=3.4.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "pymupdf>=1.25.0",
  "sentence-transformers>=3.3.0",
]

[project.scripts]
atlas-worker = "atlas_worker.main:main"
atlas-worker-http = "atlas_worker.http_app:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
atlas-common = { workspace = true }
atlas-security = { workspace = true }
atlas-ingestion = { workspace = true }
atlas-persistence = { workspace = true }
atlas-retrieval = { workspace = true }
