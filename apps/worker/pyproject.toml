[project]
name = "atlas-worker"
version = "0.1.0"
description = "Async ingest worker"
requires-python = ">=3.12"
dependencies = [
  "atlas-common",
  "atlas-security",
  "atlas-ingestion",
  "atlas-persistence",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
atlas-common = { workspace = true }
atlas-security = { workspace = true }
atlas-ingestion = { workspace = true }
atlas-persistence = { workspace = true }
