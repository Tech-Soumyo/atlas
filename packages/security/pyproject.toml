[project]
name = "atlas-security"
version = "0.1.0"
description = "ACL, auth context, injection guards"
requires-python = ">=3.12"
dependencies = [
  "atlas-common",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
atlas-common = { workspace = true }
