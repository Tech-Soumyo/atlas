[project]
name = "atlas-retrieval"
version = "0.1.0"
description = "Dense, sparse, hybrid retrieval"
requires-python = ">=3.12"
dependencies = [
  "atlas-common",
  "atlas-persistence",
  "sentence-transformers>=3.3.0",
  "numpy>=2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
atlas-common = { workspace = true }
atlas-persistence = { workspace = true }
