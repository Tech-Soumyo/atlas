[project]
name = "atlas-ingestion"
version = "0.1.0"
description = "Parse, clean, chunk, version"
requires-python = ">=3.12"
dependencies = [
  "atlas-common",
  "atlas-persistence",
  "atlas-retrieval",
  "pymupdf>=1.25.0",
  "langchain-text-splitters>=0.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
atlas-common = { workspace = true }
atlas-persistence = { workspace = true }
atlas-retrieval = { workspace = true }
