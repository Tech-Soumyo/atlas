[project]
name = "atlas-generation"
version = "0.1.0"
description = "LLM client, cites, abstain"
requires-python = ">=3.12"
dependencies = [
  "atlas-common",
  "openai>=1.60.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
atlas-common = { workspace = true }
